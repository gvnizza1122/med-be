version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: eclaim_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-eclaim}
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    container_name: eclaim_api
    ports:
      - "${PORT:-5001}:${PORT:-5000}"
    environment:
      - DB_HOST=${DB_HOST:-db}
      # - DB_PORT=${DB_PORT:-5432}:5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-eclaim}
      - PORT=${PORT:-5000}
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - SIMRS_API_KEY=${SIMRS_API_KEY}
      - SIMRS_CALLBACK_URL=${SIMRS_CALLBACK_URL}
      - SIMRS_CALLBACK_API_KEY=${SIMRS_CALLBACK_API_KEY}
      - AI_PROVIDER_BASE_URL=${AI_PROVIDER_BASE_URL}
      - AI_PROVIDER_API_KEY=${AI_PROVIDER_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_REVIEW_MODEL=${AI_REVIEW_MODEL:-gpt-6.1-sol}
      - AI_HYBRID_SOL_ENABLED=${AI_HYBRID_SOL_ENABLED:-true}
      - AI_SOL_SAMPLE_PERCENT=${AI_SOL_SAMPLE_PERCENT:-0}
      - AI_USD_IDR=${AI_USD_IDR:-18000}
      - AI_MAX_ATTEMPTS=${AI_MAX_ATTEMPTS:-3}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-60000}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL}
      - KIMI_MODEL=${KIMI_MODEL}
      - KIMI_TIMEOUT_MS=${KIMI_TIMEOUT_MS:-60000}
      - ECLAIM_PUBLIC_URL=${ECLAIM_PUBLIC_URL}
      - BATCH_AI_CONCURRENCY=${BATCH_AI_CONCURRENCY:-15}
      - DB_POOL_MAX=${DB_POOL_MAX:-30}
      - SKIP_OCR_EVIDENCE=${SKIP_OCR_EVIDENCE:-false}
      - OCR_ENHANCEMENT_TIMEOUT=${OCR_ENHANCEMENT_TIMEOUT:-180000}
      # OCR halaman scan memakai model PP-OCRv5 lewat layanan ocr_rapid
      # (RapidOCR/ONNX, ~1,5-2 dtk/halaman); gagal/timeout -> Tesseract.
      # Kembali ke runtime Paddle lama: PADDLE_OCR_URL=http://ocr_paddle:8866
      # dan jalankan dengan --profile ocr-paddle-lama.
      # OCR_ENGINE=tesseract untuk mematikan keduanya.
      - OCR_ENGINE=${OCR_ENGINE:-paddle}
      - PADDLE_OCR_URL=${PADDLE_OCR_URL:-http://ocr_rapid:8866}
      - PADDLE_OCR_TIMEOUT_MS=${PADDLE_OCR_TIMEOUT_MS:-60000}
    depends_on:
      - db
      - ocr_rapid
    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./logs:/usr/src/app/logs
    restart: unless-stopped

  ocr_rapid:
    build: ./ocr-rapid
    container_name: eclaim_ocr_rapid
    # Tidak dipublikasikan ke host; hanya dipanggil eclaim_api lewat jaringan compose.
    restart: unless-stopped

  # Versi lama (runtime Paddle, 10-16 dtk/halaman) -- disimpan sebagai cadangan,
  # tidak ikut jalan kecuali: docker compose --profile ocr-paddle-lama up -d
  ocr_paddle:
    build: ./ocr-paddle
    container_name: eclaim_ocr_paddle
    profiles: ["ocr-paddle-lama"]
    restart: unless-stopped

volumes:
  postgres_data:
